openapi: 3.1.0
info:
  title: GitHub Patch Worker
  version: 0.1.1
  description: Read complete GitHub files and apply small unified patches without resending whole files.
servers:
  - url: https://github-gpt-patch-worker.k69ysrndm7.workers.dev
paths:
  /health:
    get:
      operationId: checkPatchWorker
      summary: Check whether the Worker is online
      responses:
        "200":
          description: Worker status
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version]
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  version:
                    type: string
  /github/read-file:
    post:
      operationId: readGitHubFile
      summary: Read a complete UTF-8 text file at a branch, tag, or commit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, repo, path, ref]
              properties:
                owner:
                  type: string
                repo:
                  type: string
                path:
                  type: string
                ref:
                  type: string
                  description: Branch, tag, or commit SHA
      responses:
        "200":
          description: File contents and blob metadata
          content:
            application/json:
              schema:
                type: object
                required: [ok, path, ref, blobSha, totalLines, content]
                properties:
                  ok:
                    type: boolean
                  path:
                    type: string
                  ref:
                    type: string
                  blobSha:
                    type: string
                  totalLines:
                    type: integer
                  content:
                    type: string
        "401":
          description: Invalid bridge key
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
        "500":
          description: GitHub or Worker error
          content:
            application/json:
              schema:
                type: object
                required: [ok, error, message]
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  message:
                    type: string
  /github/apply-patches:
    post:
      operationId: applyGitHubPatches
      summary: Apply exact unified patches to up to 20 existing text files in one commit
      description: The patch must be based on expectedCommitSha. If the branch moved or a hunk does not match exactly, no commit is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, repo, branch, expectedCommitSha, message, patches]
              properties:
                owner:
                  type: string
                repo:
                  type: string
                branch:
                  type: string
                expectedCommitSha:
                  type: string
                message:
                  type: string
                patches:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [path, patch]
                    properties:
                      path:
                        type: string
                      patch:
                        type: string
                        description: Standard unified diff for this file
      responses:
        "200":
          description: New commit and changed files
          content:
            application/json:
              schema:
                type: object
                required: [ok, branch, previousCommitSha, commitSha, commitUrl, changedFiles]
                properties:
                  ok:
                    type: boolean
                  branch:
                    type: string
                  previousCommitSha:
                    type: string
                  commitSha:
                    type: string
                  commitUrl:
                    type: string
                  changedFiles:
                    type: array
                    items:
                      type: object
                      required: [path, oldBlobSha, newBlobSha]
                      properties:
                        path:
                          type: string
                        oldBlobSha:
                          type: string
                        newBlobSha:
                          type: string
        "400":
          description: Patch produced no change or request was invalid
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  path:
                    type: string
                  message:
                    type: string
        "401":
          description: Invalid bridge key
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
        "409":
          description: Branch changed or patch conflict
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  expectedCommitSha:
                    type: string
                  actualCommitSha:
                    type: string
                  path:
                    type: string
                  message:
                    type: string
        "500":
          description: GitHub or Worker error
          content:
            application/json:
              schema:
                type: object
                required: [ok, error, message]
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  message:
                    type: string
